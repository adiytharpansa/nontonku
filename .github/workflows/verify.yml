name: Verify in Emulator
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v6
        with: { gradle-version: "8.10.2" }
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run app in emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.app.nontonku/.MainActivity --ei auto_first 1
            sleep 45
            adb exec-out screencap -p > home.png || true
            sleep 25
            adb exec-out screencap -p > watch.png || true
            adb logcat -d > logcat.txt || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: emulator-verify
          path: |
            home.png
            watch.png
            logcat.txt
